<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>AI 教室實驗場</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;background:#eef1f5;color:#222;font-size:14px;overflow:hidden}
header{background:#2d4a6b;color:#fff;height:42px;padding:0 12px;display:flex;align-items:center;gap:12px}
header h1{font-size:17px;margin:0;white-space:nowrap}header .stat{font-size:12px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{cursor:pointer;border:1px solid #888;background:#fff;border-radius:5px;padding:4px 9px;font-size:13px;white-space:nowrap}button:disabled{opacity:.4;cursor:default}
button.pri{background:#2f7d4f;color:#fff;border-color:#2f7d4f}button.fake{background:#7a4fb3;color:#fff;border-color:#7a4fb3}button.sm{padding:1px 6px;font-size:12px}
main{display:grid;grid-template-columns:320px 1fr 290px;gap:8px;padding:8px;height:calc(100% - 42px)}
body.nosettings main{grid-template-columns:1fr 290px}body.nosettings #settings{display:none}
.panel{background:#fff;border-radius:8px;padding:8px;overflow:auto;box-shadow:0 1px 3px #0002;min-height:0}
.panel h3{margin:4px 0 6px;font-size:14px;border-bottom:1px solid #ddd;padding-bottom:3px}
label{display:block;font-size:12px;margin-top:5px;color:#444}input,select,textarea{width:100%;font-size:12px;padding:3px;border:1px solid #bbb;border-radius:4px}
textarea{font-family:monospace;height:140px}.row{display:flex;gap:6px}.row>*{flex:1;min-width:0}
.card{border:1px solid #cfd6e0;border-radius:7px;padding:5px 6px;margin:6px 0;background:#f8fafc}
.card .hd{display:flex;align-items:center;gap:6px;font-weight:bold;font-size:12px}.card .hd span{flex:1}
.card .g{display:grid;grid-template-columns:44px 1fr 44px 1fr;gap:3px 4px;align-items:center;margin-top:3px}
.card .g label{margin:0;font-size:11px;text-align:right}.card .g .w3{grid-column:span 3}
.card.teacher{background:#fff8e1;border-color:#e3c770}
#center{display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
#controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
#stage{flex:1;position:relative;min-height:0;background:#cfd8e3;border-radius:8px;overflow:hidden}#room{position:absolute;left:0;top:0;width:100%;height:100%;cursor:pointer}
#topLayer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3}
#board{position:absolute;left:8px;top:8px;width:min(250px,30%);background:#24412fee;color:#f3f3e0;border-radius:6px;font:12px sans-serif;z-index:2;box-shadow:0 1px 4px #0004}
#board .bh{color:#ffe9a8;font-weight:bold;padding:5px 8px 3px}#boardBody{max-height:92px;overflow-y:auto;overscroll-behavior:contain;padding:0 8px 6px;white-space:pre-wrap;line-height:15px;scrollbar-width:thin;scrollbar-color:#9bb #24412f}
#chart{width:100%;height:84px;background:#fff;border-radius:8px;flex:none}
#log div{border-bottom:1px dotted #ddd;padding:2px 0;font-size:12px}.t{color:#888}.err{color:#c00}.tch{color:#1a4d8f;font-weight:bold}
#detail{font-size:12px}#detail .act{border-left:3px solid #6a9;padding-left:4px;margin:3px 0}
#errbar{display:none;background:#fdd;color:#900;padding:3px 8px;border-radius:6px;font-size:12px}
details summary{cursor:pointer;font-size:12px;color:#335;margin-top:8px}
.hint{font-size:11px;color:#777}
</style></head><body>
<header><button class="sm" id="btnToggle" title="顯示／隱藏設定">⚙️ 設定</button><h1>🏫 AI 教室實驗場</h1>
<span class="stat" id="stat">尚未開始</span><span class="stat" id="usage">呼叫 0 次｜詞元 0</span></header>
<main>
<div class="panel" id="settings">
<h3>⚙️ AI 設定</h3>
<label>AI 服務</label><select id="provider"><option value="openai">OpenAI</option><option value="gemini">Google Gemini（OpenAI 相容）</option><option value="ollama">本地 Ollama</option><option value="custom">自訂（OpenAI 相容端點）</option></select>
<label>Base URL</label><input id="baseUrl">
<label>API 金鑰（只存在本機瀏覽器 localStorage）</label><input id="apiKey" type="password" placeholder="sk-... / AIza...（Ollama 可留空）">
<div class="row"><div><label>老師模型</label><input id="tModel"></div><div><label>學生模型（空白=同老師）</label><input id="sModel"></div></div><div class="hint" id="modelHint"></div>
<h3 style="margin-top:10px">📚 課程</h3>
<label>科目／主題</label><input id="topic" value="國中理化：浮力">
<div class="row"><div><label>課程長度（模擬分鐘）</label><input id="minutes" type="number" value="10" min="1"></div><div><label>每回合分鐘數</label><input id="tick" type="number" value="1" min="1"></div></div>
<div class="row"><div title="對應 AI 模型的 temperature 參數"><label>個性度</label><input id="temp" type="number" value="0.9" step="0.1" min="0.1" max="2" title="對應 AI 模型的 temperature 參數（0.1～2）"><div class="hint">低：乖乖照規矩；高：行為多變、有個性</div></div>
<div><label>同時呼叫上限</label><input id="conc" type="number" value="4" min="1" max="11"><div class="hint">一次同時問幾個學生；太高可能被服務擋</div></div></div>
<h3 style="margin-top:10px">🧑‍🏫 角色設定</h3>
<label><input type="checkbox" id="randomize" style="width:auto"> 每次開始時自動隨機產生學生</label>
<div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap"><button id="btnRand">🎲 隨機學生</button><button id="btnAdd">＋ 新增學生</button><button id="btnDefault">↺ 預設名單</button></div>
<div id="cards"></div>
<details><summary>進階：用 JSON 匯入／匯出角色</summary>
<textarea id="personasJson" placeholder="按「匯出成 JSON」或貼上 JSON 後按「從 JSON 匯入」"></textarea>
<div style="display:flex;gap:4px;margin-top:4px"><button class="sm" id="btnToJson">匯出成 JSON</button><button class="sm" id="btnFromJson">從 JSON 匯入</button></div></details>
<h3 style="margin-top:10px">📁 紀錄</h3>
<div style="display:flex;gap:4px;flex-wrap:wrap"><button id="btnExport">⬇️ 匯出紀錄 JSON</button><button id="btnLoad">⬆️ 載入紀錄重播（離線）</button><input type="file" id="file" accept=".json" style="display:none"></div>
</div>
<div id="center">
<div id="controls"><button class="pri" id="btnStart">▶ 開始上課</button><button class="fake" id="btnFake" title="不用金鑰、不用網路的假 AI，用來測試流程">🧪 模擬試跑</button><button id="btnPause" disabled>⏸ 暫停</button><button id="btnStep" disabled>⏭ 單步</button><button id="btnStop" disabled>⏹ 結束</button><button id="btnReplay" style="display:none" title="從頭再播一次載入的紀錄">🔁 重新播放</button>
<label style="display:inline;margin:0"><input type="checkbox" id="showAll" style="width:auto;vertical-align:middle"> 顯示全部資訊</label> <label style="display:inline;margin:0">速度 <select id="speed" style="width:auto"><option value="4000">慢</option><option value="2000" selected>1x</option><option value="700">快</option><option value="0">最快</option></select></label>
<span id="mode" style="font-size:12px;color:#555"></span></div>
<div id="errbar"></div>
<div id="stage"><canvas id="room"></canvas><canvas id="topLayer"></canvas><div id="board"><div class="bh">🧑‍🏫 黑板 <span id="boardMin"></span></div><div id="boardBody">（空）</div></div></div>
<canvas id="chart"></canvas>
</div>
<div class="panel" style="display:flex;flex-direction:column">
<h3>🧑‍🎓 角色詳情（點教室裡的人）</h3><div id="detail" style="max-height:45%;overflow:auto">點選任一位學生或老師，可以看人設和行為紀錄。點對話框可以展開完整內容。</div>
<h3>📜 事件紀錄（全班）</h3><div id="log" style="flex:1;overflow:auto"></div>
</div></main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const PRESETS={openai:{url:"https://api.openai.com/v1",model:"gpt-4o-mini"},gemini:{url:"https://generativelanguage.googleapis.com/v1beta/openai",model:"gemini-3.1-flash-lite",sModel:"gemini-3.1-flash-lite",conc:1,hint:"免費可用：gemini-3.1-flash-lite（穩定）；老師也可試 gemini-3-flash-preview"},ollama:{url:"http://localhost:11434/v1",model:"llama3.1"},custom:{url:"http://localhost:8787/v1",model:"mock"}};
const ACTIONS={wait:"⏳",listen:"👂",notes:"📝",ask:"✋",answer:"🙋",chat:"💬",daydream:"🤔",phone:"📱",sleep:"💤",other:"❔"};
const ACT_ZH={wait:"等同學回話",listen:"聽課",notes:"抄筆記",ask:"舉手發問",answer:"回答",chat:"跟同學聊天",daydream:"發呆",phone:"滑手機",sleep:"睡覺",other:"其他"};
const T_ICON={lecture:"🗣️",question:"❓",call_on:"👉",discipline:"⚠️",write_board:"✍️",answer:"💡",feedback:"👍",activity:"🧪",patrol:"🚶"};
const T_ACT_ZH={lecture:"講課",question:"提問",call_on:"點名",discipline:"管秩序",write_board:"寫黑板",answer:"回答問題",feedback:"回應學生",activity:"帶活動",patrol:"下台巡堂"};
const SPOKEN=new Set(["ask","answer","chat"]);
const MAX_SEATS=12;
const DEFAULT_PERSONAS=[
{name:"陳小明",personality:"活潑好動、愛搞笑",ability:"中等",interests:"籃球、手遊",attention:"短",friends:["林志豪"],seat:0},
{name:"林志豪",personality:"愛講話、人緣好",ability:"中下",interests:"YouTube、漫畫",attention:"短",friends:["陳小明","王建宏"],seat:3},
{name:"張雅婷",personality:"認真負責的班長",ability:"優秀",interests:"閱讀、科學",attention:"長",friends:["李佩珊"],seat:1},
{name:"李佩珊",personality:"害羞文靜",ability:"中上",interests:"畫畫",attention:"中",friends:["張雅婷"],seat:4},
{name:"王建宏",personality:"愛睡覺、昨晚熬夜",ability:"中等",interests:"電競",attention:"很短",friends:["林志豪"],seat:6},
{name:"黃思涵",personality:"好奇心強、愛發問",ability:"優秀",interests:"實驗、太空",attention:"長",friends:["吳宗翰"],seat:2},
{name:"吳宗翰",personality:"冷靜理性、話少",ability:"優秀",interests:"程式、數學",attention:"中",friends:["黃思涵"],seat:5},
{name:"劉家瑜",personality:"愛追星、容易分心",ability:"中下",interests:"K-pop、IG",attention:"短",friends:["蔡宜君"],seat:7},
{name:"蔡宜君",personality:"努力但沒自信",ability:"中下",interests:"烘焙",attention:"中",friends:["劉家瑜"],seat:8},
{name:"鄭凱文",personality:"叛逆、覺得上課無聊",ability:"中等（其實很聰明）",interests:"機車、音樂",attention:"很短",friends:[],seat:10}];
const DEFAULT_TEACHER={name:"周老師",style:"親切但會管秩序，喜歡用生活例子與提問引導學生",experience:"教學 12 年"};
const POOL={sur:"陳林黃張李王吳劉蔡楊許鄭謝郭洪曾邱廖賴周".split(""),given:["宇軒","品妍","承恩","子晴","冠廷","語彤","柏翰","欣妤","俊傑","詩涵","彥廷","郁婷","家豪","芷若","睿哲","心怡","宗穎","雨萱","昱辰","佳穎"],
pers:["活潑好動、愛搞笑","害羞文靜","認真負責","好奇心強、愛發問","叛逆、嫌上課無聊","愛講話、人緣好","冷靜理性、話少","容易緊張、沒自信","愛睡覺、常熬夜","愛現、喜歡搶答","溫和、樂於幫助同學","愛幻想、常神遊"],
abil:["優秀","中上","中等","中下","落後"],inter:["籃球","手遊","畫畫","K-pop","程式","閱讀","烘焙","動漫","音樂","實驗","足球","攝影","寫小說","電競"],att:["很短","短","中","長"]};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function seatLabel(s){return `第${Math.floor(s/3)+1}排・第${s%3+1}個`;}
function randomPersonas(n=10){const used=new Set(),ps=[];const seats=shuffle([...Array(MAX_SEATS).keys()]);
 while(ps.length<n){const nm=pick(POOL.sur)+pick(POOL.given);if(used.has(nm))continue;used.add(nm);
  let i1=pick(POOL.inter),i2=pick(POOL.inter);ps.push({name:nm,personality:pick(POOL.pers),ability:pick(POOL.abil),interests:i1===i2?i1:i1+"、"+i2,attention:pick(POOL.att),friends:[],seat:seats[ps.length]});}
 const order=shuffle([...Array(n).keys()]);for(let i=0;i+1<order.length;i+=2){if(Math.random()<.8){ps[order[i]].friends.push(ps[order[i+1]].name);ps[order[i+1]].friends.push(ps[order[i]].name);}}
 return ps;}
// ---------- persona form ----------
let personas=[],teacherP={...DEFAULT_TEACHER};
function fixSeats(ps){const used=new Set();ps.forEach(p=>{let s=parseInt(p.seat);if(!(s>=0&&s<MAX_SEATS)||used.has(s))s=-1;if(s>=0)used.add(s);p.seat=s;});
 ps.forEach(p=>{if(p.seat<0){for(let s=0;s<MAX_SEATS;s++)if(!used.has(s)){p.seat=s;used.add(s);break;}}});return ps;}
function normPersona(p){return {name:String(p.name||"").trim()||"無名",personality:p.personality||"",ability:p.ability||"",interests:p.interests||"",attention:p.attention||"中",
 friends:Array.isArray(p.friends)?p.friends:String(p.friends||"").split(/[,，、\s]+/).filter(Boolean),seat:p.seat};}
function renderCards(){const seatOpts=s=>[...Array(MAX_SEATS).keys()].map(i=>`<option value="${i}" ${i==s?"selected":""}>${seatLabel(i)}</option>`).join("");
 let h=`<div class="card teacher"><div class="hd"><span>👩‍🏫 老師</span></div><div class="g">
 <label>姓名</label><input data-t="name" value="${esc(teacherP.name)}"><label>資歷</label><input data-t="experience" value="${esc(teacherP.experience)}">
 <label>風格</label><input class="w3" data-t="style" value="${esc(teacherP.style)}"></div><div class="hint">教案會在開始上課時依主題自動產生。</div></div>`;
 personas.forEach((p,i)=>{h+=`<div class="card"><div class="hd"><span>🧑‍🎓 學生 ${i+1}</span><button class="sm" data-del="${i}" title="刪除">✕</button></div><div class="g">
 <label>姓名</label><input data-i="${i}" data-k="name" value="${esc(p.name)}"><label>座位</label><select data-i="${i}" data-k="seat">${seatOpts(p.seat)}</select>
 <label>個性</label><input class="w3" data-i="${i}" data-k="personality" value="${esc(p.personality)}">
 <label>程度</label><input data-i="${i}" data-k="ability" value="${esc(p.ability)}"><label>專注力</label><input data-i="${i}" data-k="attention" value="${esc(p.attention)}" list="attList">
 <label>興趣</label><input class="w3" data-i="${i}" data-k="interests" value="${esc(p.interests)}">
 <label>好友</label><input class="w3" data-i="${i}" data-k="friends" value="${esc((p.friends||[]).join("、"))}" placeholder="用頓號或逗號分隔"></div></div>`;});
 $("cards").innerHTML=h+`<datalist id="attList"><option value="很短"><option value="短"><option value="中"><option value="長"></datalist><div class="hint">座位：第1排最靠近黑板，第1～3個由左到右。</div>`;
 $("btnAdd").disabled=personas.length>=MAX_SEATS;}
$("cards").addEventListener("input",e=>{const t=e.target;if(t.dataset.t){teacherP[t.dataset.t]=t.value;}else if(t.dataset.k){const p=personas[+t.dataset.i];
 if(t.dataset.k==="friends")p.friends=t.value.split(/[,，、\s]+/).filter(Boolean);else if(t.dataset.k==="seat"){const s=+t.value,o=personas.find(q=>q!==p&&q.seat===s);if(o)o.seat=p.seat;p.seat=s;renderCards();}else p[t.dataset.k]=t.value;}savePersonas();});
$("cards").addEventListener("click",e=>{const d=e.target.dataset.del;if(d!=null){if(personas.length<=1)return;personas.splice(+d,1);renderCards();savePersonas();}});
function savePersonas(){localStorage.setItem("cls_personas2",JSON.stringify({students:personas,teacher:teacherP}));}
$("btnRand").onclick=()=>{personas=randomPersonas(personas.length||10);renderCards();savePersonas();};
$("btnDefault").onclick=()=>{personas=JSON.parse(JSON.stringify(DEFAULT_PERSONAS));teacherP={...DEFAULT_TEACHER};renderCards();savePersonas();};
$("btnAdd").onclick=()=>{if(personas.length>=MAX_SEATS)return;personas.push(fixSeats([...personas,{...randomPersonas(1)[0],seat:-1}]).pop());renderCards();savePersonas();};
$("btnToJson").onclick=()=>{$("personasJson").value=JSON.stringify({teacher:teacherP,students:personas},null,1);};
$("btnFromJson").onclick=()=>{try{let d=JSON.parse($("personasJson").value);const st=Array.isArray(d)?d:d.students;if(!Array.isArray(st)||!st.length)throw new Error("找不到 students 陣列");
 personas=fixSeats(st.slice(0,MAX_SEATS).map(normPersona));if(d.teacher)teacherP={...DEFAULT_TEACHER,...d.teacher};renderCards();savePersonas();}catch(e){showErr("JSON 匯入失敗："+e.message);}};
// ---------- settings ----------
const FIELDS=["provider","baseUrl","tModel","sModel","topic","minutes","tick","temp","conc","speed"];
function loadSettings(){const s=JSON.parse(localStorage.getItem("cls_settings")||"{}");FIELDS.forEach(f=>{if(s[f]!=null)$(f).value=s[f];});
 if(!s.baseUrl)applyPreset();$("apiKey").value=localStorage.getItem("cls_apikey")||"";migrateModels();modelHint();$("randomize").checked=!!s.randomize;
 try{const p=JSON.parse(localStorage.getItem("cls_personas2"));personas=fixSeats(p.students.map(normPersona));teacherP={...DEFAULT_TEACHER,...p.teacher};}catch(e){personas=JSON.parse(JSON.stringify(DEFAULT_PERSONAS));}
 renderCards();}
function saveSettings(){const s={};FIELDS.forEach(f=>s[f]=$(f).value);s.randomize=$("randomize").checked;localStorage.setItem("cls_settings",JSON.stringify(s));localStorage.setItem("cls_apikey",$("apiKey").value);}
function applyPreset(){const p=PRESETS[$("provider").value];$("baseUrl").value=p.url;$("tModel").value=p.model;$("sModel").value=p.sModel||"";if(p.conc)$("conc").value=p.conc;modelHint();}
function modelHint(){const p=PRESETS[$("provider").value]||{};$("modelHint").textContent=p.hint||"";}
// model names that providers have retired → replace saved settings automatically
const RETIRED={"gemini-2.0-flash":"gemini-3.1-flash-lite","gemini-3.0-flash":"gemini-3.1-flash-lite"};
function migrateModels(){["tModel","sModel"].forEach(id=>{const v=$(id).value.trim();if(RETIRED[v]){$(id).value=RETIRED[v];saveSettings();}});}
$("provider").onchange=()=>{applyPreset();saveSettings();};FIELDS.concat(["apiKey","randomize"]).forEach(f=>$(f).addEventListener("change",saveSettings));
$("btnToggle").onclick=()=>{document.body.classList.toggle("nosettings");};
// ---------- LLM ----------
const usage={calls:0,tokens:0,errors:0};
function showUsage(){$("usage").textContent=`呼叫 ${usage.calls} 次｜詞元 ${usage.tokens}｜錯誤 ${usage.errors}`;}
function showErr(m){const e=$("errbar");e.style.display="block";e.style.whiteSpace="pre-line";e.textContent="⚠️ "+m;clearTimeout(showErr.t);showErr.t=setTimeout(()=>e.style.display="none",8000);}
let active=0;const queue=[];
function limit(fn){return new Promise((res,rej)=>{const run=()=>{active++;fn().then(res,rej).finally(()=>{active--;if(queue.length)queue.shift()();});};
 if(active<Math.max(1,+$("conc").value||1))run();else queue.push(run);});}
function extractJSON(t){t=t.replace(/```(json)?/g,"");const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw new Error("回應中找不到 JSON");return JSON.parse(t.slice(a,b+1));}
function httpHint(status,tx){
 if(status===404)return "\n💡 模型名稱可能已過期或不存在，請到 Google AI Studio（aistudio.google.com）確認可用的模型名稱；Gemini 免費可用 gemini-3.1-flash-lite";
 if(status===429)return "\n💡 超過免費額度速率，請把同時呼叫上限調成 1 或稍後再試";
 if(status===401||status===403)return "\n💡 金鑰錯誤或未啟用";return "";}
// live-run progress: who is being asked right now, and how many calls of this turn are done

 const w=Math.max(...lines.map(l=>ctx.measureText(l).width))+12,h=lines.length*lh+8;
 const r=side?{x:Math.min(W-w-3,ax+9),y:Math.max(3,ay-h/2-4),w,h}:{x:Math.max(3,Math.min(W-w-3,ax-w/2)),y:Math.max(3,ay-h-7),w,h};
 const bg=ag.teacher?"rgba(255,246,200,":spoken?"rgba(255,255,255,":"rgba(232,240,255,";const a=exp?1:.75;
 ctx.strokeStyle=exp?"#e33":ag.teacher?"#b58b00":spoken?"#777":"#6a7fb0";ctx.lineWidth=exp?2:1.1;if(exp){ctx.shadowColor="#0006";ctx.shadowBlur=10;}ctx.fillStyle=bg+a+")";
 const tx=side?r.x:Math.max(r.x+8,Math.min(r.x+r.w-8,ax)),tipY=side?Math.min(r.y+r.h-6,Math.max(r.y+6,ay)):r.y+r.h;
 if(spoken){ctx.beginPath();if(side){ctx.moveTo(tx+1,tipY-5);ctx.lineTo(ax,ay);ctx.lineTo(tx+1,tipY+5);}else{ctx.moveTo(tx-5,tipY);ctx.lineTo(ax,ay-1);ctx.lineTo(tx+5,tipY);}ctx.fill();ctx.stroke();}
 else{[[.35,3],[.75,1.8]].forEach(([q,rr])=>{ctx.beginPath();ctx.arc(tx+(ax-tx)*q,tipY+(ay-tipY)*q,rr,0,7);ctx.fill();ctx.stroke();});}
 ctx.beginPath();ctx.roundRect(r.x,r.y,r.w,r.h,spoken?7:12);ctx.fill();if(!spoken)ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
 if(spoken){ctx.fillStyle=bg+a+")";if(side)ctx.fillRect(tx-1.5,tipY-4,2.5,8);else ctx.fillRect(tx-4,tipY-1.5,8,2.5);}
 ctx.shadowBlur=0;ctx.fillStyle=spoken?"#111":"#2b3a66";ctx.font=font;lines.forEach((l,i)=>ctx.fillText(l,r.x+6,r.y+4+(i+1)*lh-3));
 if(trunc){ctx.fillStyle="#666";ctx.font="9px sans-serif";ctx.fillText("▼",r.x+r.w-10,r.y+r.h-3);}

function drawOverlay(studs){hitBubbles=[];
 // blackboard card (the only place board text is shown)
 updateBoard();
 const agents=[];
 studs.forEach((st,i)=>{const s=seatXZ(st.seat),a=P(s.x+2,s.z,st.state.action==="answer"?134:st.state.action==="ask"?124:104),b=P(s.x,s.z,st.state.action==="answer"?92:72);agents.push({key:i,name:st.name,st:st.state,ax:a[0],ay:a[1]+6,bx:b[0]+13*K*SC(s.x),by:b[1],hp:headPos[i]});});
 if(headPos.T)agents.push({key:"T",name:(S?S.teacher.name:teacherP.name),st:S?S.teacher.state:{action:"lecture"},teacher:true,ax:headPos.T.x,ay:headPos.T.y-4,hp:headPos.T});
 agents.forEach(ag=>{const emo=ag.teacher?(T_ICON[ag.st.action]||"🗣️"):(ACTIONS[ag.st.action]||"");ctx.font="bold 12px sans-serif";const label=`${ag.name} ${emo}`;const tw=ctx.measureText(label).width;const w=tw+10+(ag.teacher?0:30);
  const r={x:ag.ax-w/2,y:ag.ay-16,w,h:16};ag.label=r;ag.tw=tw;ag.labelText=label;});
 const info=ag=>ag.teacher||$("showAll").checked||shownInfo.has(ag.key);
 const drawLabels=()=>agents.filter(info).forEach(ag=>{const r=ag.label,tw=ag.tw,label=ag.labelText;ctx.font="bold 12px sans-serif";
  if(selected===ag.key&&ag.hp){ctx.strokeStyle="#e33";ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(ag.hp.cx,ag.hp.cy,20*K+4,0,7);ctx.stroke();}
  ctx.fillStyle=ag.teacher?"rgba(255,243,196,.9)":"rgba(255,255,255,.82)";ctx.strokeStyle=selected===ag.key?"#e33":"#0004";ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(r.x,r.y,r.w,r.h,5);ctx.fill();ctx.stroke();
  ctx.fillStyle="#111";ctx.fillText(label,r.x+5,r.y+12);
  if(!ag.teacher){const att=smoothAtt(ag.name,ag.st.attention??70),bx=r.x+tw+9,by=r.y+5;ctx.fillStyle="#0005";ctx.fillRect(bx-1,by-1,28,8);ctx.fillStyle="#ddd";ctx.fillRect(bx,by,26,6);ctx.fillStyle=`hsl(${att*1.2},75%,45%)`;ctx.fillRect(bx,by,26*att/100,6);}});
 const sw=Math.max(70,Math.min(150,190*1.3*K*.72-62));
 const speaking=ag=>{const st=studs[ag.key];return SPOKEN.has(ag.st.action)&&st&&st._shownAt!=null&&clockNow()<st._shownAt+st._dur;};
 // students: spoken bubbles while they are speaking; thoughts, names and bars only when clicked (or 顯示全部資訊)
 const show=ag=>ag.st&&ag.st.content&&(ag.teacher||expanded.has(ag.key)||(info(ag)&&(ag.st.action!=="listen"||selected===ag.key))||speaking(ag));
 // back rows first, so nearer bubbles sit on top; teacher and expanded bubbles last
 agents.filter(ag=>!ag.teacher&&show(ag)&&!expanded.has(ag.key)).sort((a,b)=>a.ay-b.ay).forEach(ag=>drawBubble(ag,ag.bx,ag.by,sw,3,"12px sans-serif",15,true));
 agents.filter(ag=>ag.teacher&&show(ag)&&!expanded.has(ag.key)).forEach(ag=>ag.label.y<84?drawBubble(ag,ag.label.x+ag.label.w,ag.label.y+8,260,4,"13px sans-serif",16,true):drawBubble(ag,ag.ax,ag.label.y,260,4,"13px sans-serif",16));
 drawLabels();
 // a clicked bubble goes on the top canvas: above names, bars, other bubbles and the board card, fully opaque
 tctx.setTransform(DPR,0,0,DPR,0,0);tctx.clearRect(0,0,W,H);const c0=ctx;ctx=tctx;
 try{agents.filter(ag=>show(ag)&&expanded.has(ag.key)).forEach(ag=>ag.teacher?drawBubble(ag,ag.ax,ag.label.y,240,12,"13px sans-serif",16):drawBubble(ag,ag.bx,ag.by,230,12,"12px sans-serif",16,true));}finally{ctx.shadowBlur=0;ctx=c0;}}
// blackboard card: fixed height, scrolls with the wheel, follows the newest line unless the user scrolled up
function updateBoard(){const body=$("boardBody"),txt=(S&&S.blackboard)||"（空）",old=body.dataset.t||"";$("boardMin").textContent=S?`第 ${S.minute} 分`:"";
 if(old===txt)return;const follow=!old||!txt.startsWith(old)||body.scrollTop+body.clientHeight>=body.scrollHeight-4;
 body.textContent=txt;body.dataset.t=txt;if(follow)body.scrollTop=body.scrollHeight;}
// the board card sits above the canvas: forward clicks to the canvas so a focused bubble on top of it stays clickable
$("board").addEventListener("click",e=>{if(expanded.size)room.onclick(e);});
$("boardBody").addEventListener("wheel",e=>{const b=e.currentTarget;if(e.ctrlKey){e.preventDefault();return;}e.stopPropagation();
 if((e.deltaY<0&&b.scrollTop<=0)||(e.deltaY>0&&b.scrollTop+b.clientHeight>=b.scrollHeight-1))e.preventDefault();},{passive:false});
let lastT=performance.now();
function render(now){const dt=Math.min(.1,(now-lastT)/1000);lastT=now;const t=now/1000;FDT=dt;updateAnim(dt);if(SPEECH&&!paused)SPEECH.el+=dt*1000;
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);drawRoom();headPos={};
 const studs=S?S.students:previewStudents();const items=studs.flatMap((st,i)=>{const s=seatXZ(st.seat);return [{z:s.z,x:s.x-28,d:()=>drawDesk(s,st)},{z:s.z,x:s.x,d:()=>drawStudent(st,i,t)}];});
 items.push({z:TA.z,x:TA.x,d:()=>drawTeacher(t)});items.push({x:(PODIUM.x0+PODIUM.x1)/2,z:480,d:drawPodium});items.sort((a,b)=>a.x-b.x||a.z-b.z);items.forEach(it=>it.d());
 drawOverlay(studs);
 if(!S){ctx.fillStyle="#000a";ctx.font="bold 15px sans-serif";const m="按「▶ 開始上課」或「🧪 模擬試跑」，也可以載入紀錄重播";const w=ctx.measureText(m).width+20;ctx.beginPath();ctx.roundRect(W/2-w/2,H-36,w,28,8);ctx.fill();ctx.fillStyle="#fff";ctx.fillText(m,W/2-w/2+10,H-17);}
 requestAnimationFrame(render);}
room.onclick=e=>{const r=room.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;

 expanded.clear();
 let best=null,bd=50;for(const k in headPos){const p=headPos[k],d=Math.hypot(x-p.cx,y-(p.cy+16*K));if(d<bd){bd=d;best=k;}}

 // clicking a student toggles their name, attention bar and inner thoughts

function renderDetail(){if(selected==null){return;}const studs=S?S.students:previewStudents();const isT=selected==="T";const ag=isT?(S?S.teacher:teacherP):studs[selected];if(!ag)return;
 const plan=S&&S.plan;const info=isT?`<b>${esc(ag.name)}</b>（老師）<br>風格：${esc(ag.style)}<br>資歷：${esc(ag.experience)}<br>教案目標：${esc(plan&&plan.goal)}<br>${((plan&&plan.segments)||[]).map(s=>`${s.start}-${s.end}分：${esc(s.activity)}`).join("<br>")}`
 :`<b>${esc(ag.name)}</b>（${seatLabel(ag.seat)}）<br>個性：${esc(ag.personality)}<br>程度：${esc(ag.ability)}｜專注力：${esc(ag.attention)}<br>興趣：${esc(ag.interests)}<br>好友：${esc((ag.friends||[]).join("、")||"無")}<br>目前專注度：${ag.state?ag.state.attention:"-"}`;
 const now=S?S.minute:0;const logs=((ag.log)||[]).filter(l=>l.min<=now).slice().reverse().map(l=>`<div class="act">[${l.min}分] ${esc((ACT_ZH[l.action]||T_ACT_ZH[l.action]||l.action))}${l.target?"→"+esc(l.target):""}：${esc(l.content)} <i>${esc(l.mood)}</i></div>`).join("");
 $("detail").innerHTML=info+"<hr>"+(logs||"尚無紀錄");}
